<svg width="500" height="400" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="100%" height="100%" fill="#f8fafc"/>

  <!-- Decorative border -->
  <rect x="10" y="10" width="480" height="380" fill="none" stroke="#e2e8f0" stroke-width="2" rx="12"/>

  <!-- Title -->
  <text x="250" y="60" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="#1e293b">Flores Eternas</text>
  <text x="250" y="85" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="#64748b">Belleza que perdura en el tiempo</text>

  <!-- Main flower illustration -->
  <g transform="translate(200, 120)">
    <!-- Stem -->
    <rect x="48" y="100" width="4" height="120" fill="#22c55e"/>

    <!-- Leaves -->
    <ellipse cx="35" cy="140" rx="15" ry="8" fill="#16a34a" transform="rotate(-30 35 140)"/>
    <ellipse cx="65" cy="160" rx="12" ry="6" fill="#16a34a" transform="rotate(25 65 160)"/>

    <!-- Flower petals -->
    <g transform="translate(50, 100)">
      <!-- Center circle -->
      <circle cx="0" cy="0" r="8" fill="#fbbf24"/>

      <!-- Petals -->
      <ellipse cx="0" cy="-18" rx="12" ry="20" fill="#ec4899" transform="rotate(0)"/>
      <ellipse cx="15" cy="-9" rx="12" ry="20" fill="#f97316" transform="rotate(60)"/>
      <ellipse cx="15" cy="9" rx="12" ry="20" fill="#ef4444" transform="rotate(120)"/>
      <ellipse cx="0" cy="18" rx="12" ry="20" fill="#8b5cf6" transform="rotate(180)"/>
      <ellipse cx="-15" cy="9" rx="12" ry="20" fill="#06b6d4" transform="rotate(240)"/>
      <ellipse cx="-15" cy="-9" rx="12" ry="20" fill="#10b981" transform="rotate(300)"/>
    </g>
  </g>

  <!-- Decorative elements -->
  <g transform="translate(100, 250)">
    <circle cx="0" cy="0" r="3" fill="#f472b6" opacity="0.6"/>
    <circle cx="20" cy="-10" r="2" fill="#a78bfa" opacity="0.6"/>
    <circle cx="40" cy="5" r="2.5" fill="#34d399" opacity="0.6"/>
  </g>

  <g transform="translate(350, 180)">
    <circle cx="0" cy="0" r="2.5" fill="#fbbf24" opacity="0.6"/>
    <circle cx="15" cy="10" r="2" fill="#fb7185" opacity="0.6"/>
    <circle cx="30" cy="-5" r="3" fill="#60a5fa" opacity="0.6"/>
  </g>

  <!-- Features list -->
  <text x="80" y="300" font-family="Arial, sans-serif" font-size="14" fill="#374151">✓ Duran 2-5 años</text>
  <text x="80" y="320" font-family="Arial, sans-serif" font-size="14" fill="#374151">✓ Sin mantenimiento</text>
  <text x="280" y="300" font-family="Arial, sans-serif" font-size="14" fill="#374151">✓ Para alérgicos</text>
  <text x="280" y="320" font-family="Arial, sans-serif" font-size="14" fill="#374151">✓ Decoración perfecta</text>

  <!-- Bottom text -->
  <text x="250" y="370" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#9ca3af">Reemplaza esta imagen con tu foto real</text>
</svg>